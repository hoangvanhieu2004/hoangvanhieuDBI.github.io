<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank you | Hoàng Văn Hiếu</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@500;700&display=swap&subset=vietnamese" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="thanks-page">

<main class="thanks-card">
    <div class="thanks-icon"><i class="fas fa-circle-check"></i></div>
    <h1 data-i18n="thanks.title">Thank you!</h1>
    <p data-i18n="thanks.text">Thank you for reaching out and for your interest in my profile. I will get back to you shortly and look forward to meeting you at your earliest convenience.</p>
    <a href="index.html" class="btn thanks-btn">
        <i class="fas fa-arrow-left"></i>
        <span data-i18n="thanks.back">Back to portfolio</span>
    </a>
</main>

<script>
    // Use the language the visitor chose on the portfolio page.
    const VI = {
        'thanks.title': 'Cảm ơn anh/chị!',
        'thanks.text': 'Cảm ơn anh/chị đã liên hệ và quan tâm đến hồ sơ của tôi. Tôi sẽ phản hồi sớm và rất mong được gặp anh/chị trong thời gian gần nhất.',
        'thanks.back': 'Quay lại trang portfolio'
    };
    let lang = 'en';
    try { lang = localStorage.getItem('lang') || 'en'; } catch (e) { /* ignore */ }
    if (lang === 'vi') {
        document.documentElement.lang = 'vi';
        document.title = 'Cảm ơn | Hoàng Văn Hiếu';
        document.querySelectorAll('[data-i18n]').forEach(el => {
            if (VI[el.dataset.i18n]) el.textContent = VI[el.dataset.i18n];
        });
    }
</script>
</body>
</html>
